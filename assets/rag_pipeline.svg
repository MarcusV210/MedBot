<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="medGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="medGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="medGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B22222;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#00000040"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">🧬 BioBERT Medical RAG Pipeline</text>
  
  <!-- Knowledge Base Section -->
  <rect x="50" y="70" width="800" height="120" rx="15" fill="#e8f5e8" stroke="#28a745" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#155724">📚 Medical Knowledge Base Preparation</text>
  
  <!-- Harrison's Textbook -->
  <rect x="80" y="110" width="180" height="60" rx="10" fill="url(#medGrad1)" stroke="#20c997" stroke-width="2"/>
  <text x="170" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">📖 Harrison's 21st</text>
  <text x="170" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">4,000+ pages</text>
  <text x="170" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Medical Authority</text>
  
  <!-- PubMed Database -->
  <rect x="280" y="110" width="180" height="60" rx="10" fill="url(#medGrad2)" stroke="#007bff" stroke-width="2"/>
  <text x="370" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🔬 PubMed Corpus</text>
  <text x="370" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">4.5M abstracts</text>
  <text x="370" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Research Papers</text>
  
  <!-- Clinical Data -->
  <rect x="480" y="110" width="180" height="60" rx="10" fill="url(#medGrad3)" stroke="#dc3545" stroke-width="2"/>
  <text x="570" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🏥 Clinical Notes</text>
  <text x="570" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">100K+ records</text>
  <text x="570" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Healthcare Data</text>
  
  <!-- BioBERT Processing -->
  <rect x="680" y="110" width="150" height="60" rx="10" fill="#6f42c1" stroke="#5a2d91" stroke-width="2"/>
  <text x="755" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🧬 BioBERT</text>
  <text x="755" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Medical NLP</text>
  <text x="755" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Domain Trained</text>
  
  <!-- Arrows down -->
  <path d="M170 170 L170 220" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M370 170 L370 220" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M570 170 L570 220" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M755 170 L755 220" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Vector Database -->
  <rect x="200" y="220" width="500" height="80" rx="15" fill="#17a2b8" stroke="#138496" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">🗄️ ChromaDB Vector Store</text>
  <text x="450" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Medical Embeddings • Semantic Search • 4M+ Vectors</text>
  <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">BioBERT-encoded Medical Knowledge</text>
  
  <!-- User Query -->
  <rect x="375" y="340" width="150" height="50" rx="25" fill="#28a745" stroke="#20c997" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">👤 Medical Query</text>
  
  <!-- Arrow down -->
  <path d="M450 390 L450 430" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Query Processing -->
  <rect x="50" y="430" width="800" height="100" rx="15" fill="#fff3cd" stroke="#ffc107" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#856404">🔍 Medical Query Processing</text>
  
  <!-- Query steps -->
  <rect x="80" y="470" width="160" height="50" rx="10" fill="#fd7e14" stroke="#e55a00" stroke-width="2"/>
  <text x="160" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">🔤 Medical Term</text>
  <text x="160" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Preprocessing</text>
  
  <rect x="260" y="470" width="160" height="50" rx="10" fill="#6610f2" stroke="#520dc2" stroke-width="2"/>
  <text x="340" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">🧬 BioBERT</text>
  <text x="340" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Embedding</text>
  
  <rect x="440" y="470" width="160" height="50" rx="10" fill="#e83e8c" stroke="#d91a72" stroke-width="2"/>
  <text x="520" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">🎯 Semantic</text>
  <text x="520" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Similarity</text>
  
  <rect x="620" y="470" width="160" height="50" rx="10" fill="#20c997" stroke="#17a2b8" stroke-width="2"/>
  <text x="700" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">📊 Top-K</text>
  <text x="700" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Retrieval</text>
  
  <!-- Arrow up to vector store -->
  <path d="M450 430 L450 300" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow down -->
  <path d="M450 530 L450 570" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Final Response -->
  <rect x="250" y="570" width="400" height="80" rx="15" fill="url(#medGrad1)" stroke="#28a745" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">✨ Medical Response</text>
  <text x="450" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">83.9% Accuracy • Evidence-Based • Citation-Backed</text>
  <text x="450" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Professional Medical Interface</text>
  
  <!-- Performance metrics -->
  <rect x="50" y="670" width="200" height="25" rx="5" fill="#28a745" stroke="#20c997" stroke-width="1"/>
  <text x="150" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">RAG: 83.9% Accuracy</text>
  
  <rect x="270" y="670" width="200" height="25" rx="5" fill="#007bff" stroke="#0056b3" stroke-width="1"/>
  <text x="370" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">BioBERT: 89.2% NER</text>
  
  <rect x="490" y="670" width="200" height="25" rx="5" fill="#dc3545" stroke="#c82333" stroke-width="1"/>
  <text x="590" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Response: 1.2s avg</text>
  
  <rect x="710" y="670" width="140" height="25" rx="5" fill="#6f42c1" stroke="#5a2d91" stroke-width="1"/>
  <text x="780" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">4M+ Vectors</text>
</svg>