<svg width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f42c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e83e8c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc3545;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="500" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="15"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">🔬 Dual-Pathway Medical AI System</text>
  
  <!-- User Query -->
  <rect x="425" y="60" width="150" height="40" rx="20" fill="#17a2b8" stroke="#138496" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">👤 Medical Query</text>
  
  <!-- Split arrows -->
  <path d="M450 100 L200 150" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrowhead)"/>
  <path d="M550 100 L800 150" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- RAG Pathway -->
  <rect x="50" y="150" width="350" height="250" rx="20" fill="url(#ragGrad)" stroke="#28a745" stroke-width="3" filter="url(#shadow)"/>
  <text x="225" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">📚 RAG Pathway</text>
  <text x="225" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Retrieval-Augmented Generation</text>
  
  <!-- RAG Components -->
  <rect x="70" y="220" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="225" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🧬 BioBERT Medical Embeddings</text>
  
  <rect x="70" y="260" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="225" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">📖 Harrison's Textbook + PubMed (4M+ docs)</text>
  
  <rect x="70" y="300" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="225" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🗄️ ChromaDB Vector Database</text>
  
  <rect x="70" y="340" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="225" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🔍 Semantic Medical Search</text>
  
  <!-- RAG Performance -->
  <rect x="70" y="375" width="310" height="20" rx="10" fill="#ffffff" stroke="#28a745" stroke-width="2"/>
  <text x="225" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">🏆 83.9% Accuracy • 1.2s Response</text>
  
  <!-- LLM Pathway -->
  <rect x="600" y="150" width="350" height="250" rx="20" fill="url(#llmGrad)" stroke="#6f42c1" stroke-width="3" filter="url(#shadow)"/>
  <text x="775" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">🤖 LLM Pathway</text>
  <text x="775" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Large Language Models</text>
  
  <!-- LLM Components -->
  <rect x="620" y="220" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="775" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">💬 GPT-4o-mini (GitHub AI)</text>
  
  <rect x="620" y="260" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="775" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🦙 Llama 405B (Meta AI)</text>
  
  <rect x="620" y="300" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="775" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🔬 DeepSeek R1 (Reasoning)</text>
  
  <rect x="620" y="340" width="310" height="30" rx="5" fill="#ffffff30" stroke="#ffffff50" stroke-width="1"/>
  <text x="775" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">💭 Contextual Understanding</text>
  
  <!-- LLM Performance -->
  <rect x="620" y="375" width="310" height="20" rx="10" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/>
  <text x="775" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6f42c1">🏆 77.0% Accuracy • 1.8s Response</text>
  
  <!-- Merge arrows -->
  <path d="M225 400 L450 440" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrowhead)"/>
  <path d="M775 400 L550 440" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- Fusion Layer -->
  <rect x="350" y="440" width="300" height="50" rx="25" fill="url(#fusionGrad)" stroke="#dc3545" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">⚖️ Intelligent Response Fusion</text>
  <text x="500" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🏆 85.2% Combined Accuracy • 1.5s Average Response</text>
  
  <!-- Advantages boxes -->
  <rect x="70" y="420" width="150" height="60" rx="10" fill="#28a745" stroke="#20c997" stroke-width="2" opacity="0.9"/>
  <text x="145" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">✅ RAG Advantages</text>
  <text x="145" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• Factual accuracy</text>
  <text x="145" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• Source citations</text>
  
  <rect x="780" y="420" width="150" height="60" rx="10" fill="#6f42c1" stroke="#5a2d91" stroke-width="2" opacity="0.9"/>
  <text x="855" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">✅ LLM Advantages</text>
  <text x="855" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• Contextual reasoning</text>
  <text x="855" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• Natural language</text>
</svg>