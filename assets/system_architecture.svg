<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673AB7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">🏥 MedBot System Architecture</text>
  
  <!-- User Input -->
  <rect x="350" y="60" width="100" height="40" rx="20" fill="url(#grad1)" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">👤 User Query</text>
  
  <!-- Arrow down -->
  <path d="M400 100 L400 130" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Query Processing -->
  <rect x="320" y="130" width="160" height="40" rx="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">🔍 Query Processing</text>
  
  <!-- Split arrows -->
  <path d="M350 170 L200 220" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M400 170 L400 220" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M450 170 L600 220" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- RAG System -->
  <rect x="50" y="220" width="150" height="80" rx="15" fill="url(#grad2)" stroke="#e67e22" stroke-width="2"/>
  <text x="125" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">📚 RAG System</text>
  <text x="125" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">📖 Harrison's</text>
  <text x="125" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🗄️ ChromaDB</text>
  <text x="125" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">83.9% Accuracy</text>
  
  <!-- GitHub AI -->
  <rect x="325" y="220" width="150" height="80" rx="15" fill="url(#grad3)" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">🤖 GitHub AI</text>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">💬 GPT-4o 🦙 Llama</text>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🔬 DeepSeek</text>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">77.0% Accuracy</text>
  
  <!-- Analytics -->
  <rect x="600" y="220" width="150" height="80" rx="15" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="675" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">📊 Analytics</text>
  <text x="675" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🧠 Semantic</text>
  <text x="675" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">📈 Confidence</text>
  <text x="675" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">⚖️ Comparison</text>
  
  <!-- Merge arrows -->
  <path d="M200 300 L350 380" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M400 300 L400 380" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M600 300 L450 380" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Response Fusion -->
  <rect x="300" y="380" width="200" height="60" rx="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">⚖️ Response Fusion</text>
  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">85.2% Combined Accuracy</text>
  
  <!-- Arrow down -->
  <path d="M400 440 L400 480" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Final Output -->
  <rect x="300" y="480" width="200" height="60" rx="20" fill="url(#grad1)" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">✨ Medical Response</text>
  <text x="400" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">👨‍⚕️ Professional UI</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>