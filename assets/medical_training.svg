<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bioGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bioGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bioGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45B7D1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#96CEB4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bioGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFECD2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCB69F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" rx="15"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2c3e50">🧬 Medical AI Training Foundation</text>
  
  <!-- BioBERT Section -->
  <rect x="50" y="70" width="300" height="200" rx="15" fill="url(#bioGrad1)" stroke="#e74c3c" stroke-width="3" filter="url(#glow)"/>
  <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">🧬 BioBERT</text>
  <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Biomedical Language Model</text>
  
  <!-- BioBERT details -->
  <rect x="70" y="140" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="200" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">📚 Pre-trained on PubMed + PMC</text>
  
  <rect x="70" y="170" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="200" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🔬 4.5M biomedical abstracts</text>
  
  <rect x="70" y="200" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="200" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">📊 89.2% Medical NER accuracy</text>
  
  <rect x="70" y="230" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="200" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🎯 Domain-specific understanding</text>
  
  <!-- Clinical-BERT Section -->
  <rect x="450" y="70" width="300" height="200" rx="15" fill="url(#bioGrad2)" stroke="#1abc9c" stroke-width="3" filter="url(#glow)"/>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">🏥 Clinical-BERT</text>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Healthcare Language Model</text>
  
  <!-- Clinical-BERT details -->
  <rect x="470" y="140" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="600" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🏥 Trained on clinical notes</text>
  
  <rect x="470" y="170" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="600" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">📋 100K+ medical records</text>
  
  <rect x="470" y="200" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="600" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🎯 92.1% Clinical entity recognition</text>
  
  <rect x="470" y="230" width="260" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="600" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">💬 Healthcare terminology</text>
  
  <!-- Arrows pointing down -->
  <path d="M200 270 L200 320" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 270 L600 320" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Integration Layer -->
  <rect x="150" y="320" width="500" height="120" rx="15" fill="url(#bioGrad3)" stroke="#3498db" stroke-width="3" filter="url(#glow)"/>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">⚡ Medical AI Integration</text>
  
  <!-- Integration components -->
  <rect x="170" y="370" width="140" height="30" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="240" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">🔍 Semantic Search</text>
  
  <rect x="330" y="370" width="140" height="30" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">📊 Vector Embeddings</text>
  
  <rect x="490" y="370" width="140" height="30" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="560" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">🎯 Context Matching</text>
  
  <rect x="250" y="405" width="300" height="25" rx="5" fill="#ffffff40" stroke="#ffffff60" stroke-width="1"/>
  <text x="400" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">🏥 Professional Medical Interface</text>
  
  <!-- Arrow down -->
  <path d="M400 440 L400 480" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Performance Results -->
  <rect x="100" y="480" width="600" height="80" rx="15" fill="url(#bioGrad4)" stroke="#f39c12" stroke-width="3" filter="url(#glow)"/>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#8b4513">🏆 Performance Results</text>
  
  <!-- Performance metrics -->
  <rect x="120" y="525" width="130" height="25" rx="5" fill="#28a745" stroke="#20c997" stroke-width="1"/>
  <text x="185" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">RAG: 83.9%</text>
  
  <rect x="270" y="525" width="130" height="25" rx="5" fill="#007bff" stroke="#0056b3" stroke-width="1"/>
  <text x="335" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">BioBERT: 89.2%</text>
  
  <rect x="420" y="525" width="130" height="25" rx="5" fill="#dc3545" stroke="#c82333" stroke-width="1"/>
  <text x="485" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Clinical: 92.1%</text>
  
  <rect x="570" y="525" width="130" height="25" rx="5" fill="#6f42c1" stroke="#5a2d91" stroke-width="1"/>
  <text x="635" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Combined: 85.2%</text>
  
  <!-- Dataset info -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">📊 Training Data: 4M+ medical documents • PubMed + Clinical notes + Harrison's textbook</text>
</svg>